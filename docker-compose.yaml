version: '3'

services:
  db:
    container_name: peter_db
    image: postgres:latest
    networks:
      - isolated
    ports:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    env_file: .env

  database-handler:
    build:
      context: ./database-handler
      dockerfile: Dockerfile
    volumes:
      - common:/app/common:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - isolated
      - default
    ports:
      - "8000:8000"
    develop:
      watch:
        - action: sync+restart
          target: /app
          path: ./database-handler/src

  discord-bot:
    container_name: discord_bot
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    volumes:
      - common:/app/common:ro
    develop:
      watch:
        - action: sync+restart
          target: /app
          path: ./discord-bot/src
    env_file: ./.env

  nettskjema-parser:
    build:
      context: ./nettskjema-parser
      dockerfile: Dockerfile
    volumes:
      - common:/app/common:ro
    develop:
      watch:
        - action: sync+restart
          target: /app
          path: ./nettskjema-parser/src
    env_file: ./.env

networks:
  isolated:
    driver: bridge
    internal: true
  default:
    driver: bridge

volumes:
  common:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./common